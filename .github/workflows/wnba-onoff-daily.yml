name: Daily WNBA On-Off Fetch

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'WNBA season year (auto-detects if empty)'
        default: ''
      include_playoffs:
        description: 'Also fetch WNBA playoff splits'
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas

      - name: Detect season year
        id: season
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            echo "year=${{ inputs.year }}" >> "$GITHUB_OUTPUT"
          else
            python -c "from fetch_wnba_onoff import current_wnba_season; print(f'year={current_wnba_season()}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch WNBA on-off data
        env:
          INPUT_YEAR: ${{ inputs.year }}
          INCLUDE_PLAYOFFS: ${{ inputs.include_playoffs || vars.WNBA_INCLUDE_PLAYOFFS == 'true' }}
        run: |
          args=()
          if [[ -n "$INPUT_YEAR" ]]; then
            args+=(--year "$INPUT_YEAR")
          fi
          if [[ "$INCLUDE_PLAYOFFS" == "true" ]]; then
            args+=(--include-playoffs)
          fi
          python fetch_wnba_onoff.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: wnba-onoff-${{ steps.season.outputs.year }}
          path: output/
          retention-days: 30
